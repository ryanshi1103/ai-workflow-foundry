<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">GitHub Release Assistant demo flow</title>
  <desc id="desc">A synthetic offline demo moves from a release goal through planning, assigned roles, review, evidence, and a human approval stop with no automatic publishing.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172f"/><stop offset="1" stop-color="#123947"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4bd4e6"/></marker></defs>
  <rect x="1" y="1" width="1198" height="498" rx="28" fill="url(#bg)" stroke="#2b4168" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="56" y="66" fill="#f4f8ff" font-size="28" font-weight="700">GitHub Release Assistant</text><text x="1144" y="64" text-anchor="end" fill="#ffc65a" font-size="16" font-weight="700">SYNTHETIC OFFLINE ALPHA DEMO</text><text x="56" y="100" fill="#9facca" font-size="17">“Prepare my GitHub release” becomes a visible plan—and stops before release authority.</text>
    <g stroke="#4bd4e6" stroke-width="3" marker-end="url(#arrow)"><path d="M224 230H258"/><path d="M432 230H466"/><path d="M640 230H674"/><path d="M848 230H882"/></g>
    <g fill="#1d2b50" stroke-width="2"><rect x="50" y="168" width="174" height="124" rx="18" stroke="#8b7cff"/><rect x="258" y="168" width="174" height="124" rx="18" stroke="#4bd4e6"/><rect x="466" y="142" width="174" height="176" rx="18" stroke="#4bd4e6"/><rect x="674" y="168" width="174" height="124" rx="18" stroke="#43e6a0"/><rect x="882" y="142" width="268" height="176" rx="18" stroke="#ffc65a"/></g>
    <g text-anchor="middle"><text x="137" y="210" fill="#f4f8ff" font-size="19" font-weight="700">Goal</text><text x="137" y="240" fill="#9facca" font-size="14">bounded fixture</text><text x="137" y="264" fill="#9facca" font-size="14">no publish</text><text x="345" y="210" fill="#f4f8ff" font-size="19" font-weight="700">Plan</text><text x="345" y="240" fill="#9facca" font-size="14">five tasks</text><text x="345" y="264" fill="#9facca" font-size="14">declared dependencies</text>
      <text x="553" y="182" fill="#f4f8ff" font-size="19" font-weight="700">Assigned roles</text><text x="553" y="218" fill="#9facca" font-size="14">Claude · planning</text><text x="553" y="244" fill="#9facca" font-size="14">Codex · code stage</text><text x="553" y="270" fill="#9facca" font-size="14">DeepSeek · review</text><text x="553" y="296" fill="#9facca" font-size="14">Local · test stage</text>
      <text x="761" y="210" fill="#43e6a0" font-size="19" font-weight="700">Review</text><text x="761" y="240" fill="#9facca" font-size="14">state + usage</text><text x="761" y="264" fill="#9facca" font-size="14">durable evidence</text><text x="1016" y="184" fill="#ffc65a" font-size="19" font-weight="700">Human approval stop</text><text x="1016" y="220" fill="#f4f8ff" font-size="15">package: skipped_pending_human</text><text x="1016" y="252" fill="#9facca" font-size="14">No automatic push</text><text x="1016" y="276" fill="#9facca" font-size="14">No tag · No release</text><text x="1016" y="300" fill="#9facca" font-size="14">No hidden execution</text></g>
    <rect x="304" y="382" width="592" height="58" rx="29" fill="#17213d" stroke="#425984"/><text x="600" y="418" text-anchor="middle" fill="#f4f8ff" font-size="17">Proves coordination mechanics—not release-package quality or live model calls</text>
  </g>
</svg>
