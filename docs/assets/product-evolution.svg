<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">From fragmented AI tools to coordinated systems</title>
  <desc id="desc">Disconnected models and tools managed manually become a bounded FlowFoundry workflow with evidence and a human decision.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172f"/><stop offset="1" stop-color="#123947"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10z" fill="#4bd4e6"/></marker></defs>
  <rect x="1" y="1" width="1198" height="538" rx="28" fill="url(#bg)" stroke="#2b4168" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="56" y="66" fill="#f4f8ff" font-size="28" font-weight="700">The shift: from individual tools to coordinated systems</text>
    <rect x="48" y="104" width="494" height="382" rx="22" fill="#17213d" stroke="#425984"/><text x="295" y="148" text-anchor="middle" fill="#ff6b78" font-size="18" font-weight="700">TODAY · FRAGMENTED</text>
    <g fill="#1d2b50" stroke="#8b7cff" stroke-width="2"><rect x="84" y="180" width="126" height="62" rx="14"/><rect x="232" y="180" width="126" height="62" rx="14"/><rect x="380" y="180" width="126" height="62" rx="14"/><rect x="158" y="268" width="126" height="62" rx="14"/><rect x="306" y="268" width="126" height="62" rx="14"/></g>
    <g fill="#f4f8ff" font-size="16" text-anchor="middle"><text x="147" y="218">Model A</text><text x="295" y="218">Model B</text><text x="443" y="218">Coding tool</text><text x="221" y="306">Local tool</text><text x="369" y="306">Project data</text></g>
    <g stroke="#ff6b78" stroke-width="2" stroke-dasharray="5 7"><path d="M147 242 250 386"/><path d="M295 242 275 386"/><path d="M443 242 300 386"/><path d="M221 330 255 386"/><path d="M369 330 295 386"/></g>
    <circle cx="275" cy="412" r="48" fill="#302b43" stroke="#ffc65a" stroke-width="3"/><text x="275" y="406" text-anchor="middle" fill="#f4f8ff" font-size="17" font-weight="700">Human</text><text x="275" y="430" text-anchor="middle" fill="#ffc65a" font-size="13">manual coordination</text>
    <path d="M566 296H628" stroke="#4bd4e6" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="658" y="104" width="494" height="382" rx="22" fill="#17213d" stroke="#4bd4e6" stroke-width="2"/><text x="905" y="148" text-anchor="middle" fill="#43e6a0" font-size="18" font-weight="700">FLOWFOUNDRY · BOUNDED</text>
    <rect x="704" y="184" width="130" height="62" rx="14" fill="#1d2b50" stroke="#8b7cff" stroke-width="2"/><text x="769" y="212" text-anchor="middle" fill="#f4f8ff" font-size="16">Human goal</text><text x="769" y="232" text-anchor="middle" fill="#9facca" font-size="13">+ constraints</text>
    <path d="M834 215H870" stroke="#4bd4e6" stroke-width="3" marker-end="url(#arrow)"/><rect x="870" y="174" width="230" height="82" rx="16" fill="#1d2b50" stroke="#4bd4e6" stroke-width="3"/><text x="985" y="207" text-anchor="middle" fill="#4bd4e6" font-size="19" font-weight="700">Coordination layer</text><text x="985" y="232" text-anchor="middle" fill="#9facca" font-size="14">plan · route · review · recover</text>
    <g fill="#1d2b50" stroke="#425984"><rect x="710" y="302" width="126" height="54" rx="12"/><rect x="846" y="302" width="126" height="54" rx="12"/><rect x="982" y="302" width="126" height="54" rx="12"/></g><g fill="#f4f8ff" font-size="15" text-anchor="middle"><text x="773" y="335">Eligible models</text><text x="909" y="335">Local tools</text><text x="1045" y="335">Projects</text></g>
    <path d="M985 256V286H773V302M985 286H909V302M985 286H1045V302" fill="none" stroke="#4bd4e6" stroke-width="2"/>
    <rect x="740" y="402" width="200" height="48" rx="24" fill="#173a35" stroke="#43e6a0"/><text x="840" y="432" text-anchor="middle" fill="#43e6a0" font-size="16">Evidence</text><rect x="960" y="402" width="160" height="48" rx="24" fill="#302b43" stroke="#ffc65a"/><text x="1040" y="432" text-anchor="middle" fill="#ffc65a" font-size="16">Human decision</text>
  </g>
</svg>
