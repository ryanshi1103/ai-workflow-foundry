<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">FlowFoundry product roadmap</title>
  <desc id="desc">Three evidence-gated stages: the current Alpha AI Coordination Layer, the designed Personal AI Command Center, and the future Personal AI Operating System.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10172f"/><stop offset="1" stop-color="#123947"/></linearGradient></defs>
  <rect x="1" y="1" width="1198" height="478" rx="28" fill="url(#bg)" stroke="#2b4168" stroke-width="2"/>
  <g font-family="system-ui,-apple-system,Segoe UI,sans-serif">
    <text x="56" y="66" fill="#f4f8ff" font-size="28" font-weight="700">Product evolution</text><text x="56" y="98" fill="#9facca" font-size="17">Stages are evidence gates—not claims that future capabilities already exist.</text>
    <path d="M180 180H1020" stroke="#425984" stroke-width="6" stroke-linecap="round"/><circle cx="220" cy="180" r="16" fill="#43e6a0"/><circle cx="600" cy="180" r="16" fill="#ffc65a"/><circle cx="980" cy="180" r="16" fill="#8b7cff"/>
    <rect x="70" y="220" width="300" height="190" rx="20" fill="#173a35" stroke="#43e6a0" stroke-width="2"/><text x="220" y="260" text-anchor="middle" fill="#43e6a0" font-size="16" font-weight="700">CURRENT · ALPHA</text><text x="220" y="296" text-anchor="middle" fill="#f4f8ff" font-size="21" font-weight="700">AI Coordination Layer</text><text x="220" y="332" text-anchor="middle" fill="#d7e5e0" font-size="15">plan · route · review</text><text x="220" y="358" text-anchor="middle" fill="#d7e5e0" font-size="15">approve · recover · evidence</text>
    <rect x="450" y="220" width="300" height="190" rx="20" fill="#302b43" stroke="#ffc65a" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="260" text-anchor="middle" fill="#ffc65a" font-size="16" font-weight="700">DESIGNED · NOT IMPLEMENTED</text><text x="600" y="296" text-anchor="middle" fill="#f4f8ff" font-size="21" font-weight="700">Personal AI Command Center</text><text x="600" y="332" text-anchor="middle" fill="#ddd5e7" font-size="15">approval-first PWA</text><text x="600" y="358" text-anchor="middle" fill="#ddd5e7" font-size="15">no credentials · no remote shell</text>
    <rect x="830" y="220" width="300" height="190" rx="20" fill="#24244a" stroke="#8b7cff" stroke-width="2" stroke-dasharray="8 6"/><text x="980" y="260" text-anchor="middle" fill="#8b7cff" font-size="16" font-weight="700">FUTURE</text><text x="980" y="296" text-anchor="middle" fill="#f4f8ff" font-size="21" font-weight="700">Personal AI OS</text><text x="980" y="332" text-anchor="middle" fill="#d8d5f0" font-size="15">user-owned context + provenance</text><text x="980" y="358" text-anchor="middle" fill="#d8d5f0" font-size="15">privacy · control · portability</text>
  </g>
</svg>
