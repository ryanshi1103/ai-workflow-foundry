<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">FlowFoundry AI</title>
  <desc id="desc">Three controlled workflow paths entering a bright verified core and leaving as one artifact.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="32" x2="464" y2="480" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111936"/>
      <stop offset="0.55" stop-color="#18275a"/>
      <stop offset="1" stop-color="#0d4f58"/>
    </linearGradient>
    <linearGradient id="flow" x1="108" y1="96" x2="408" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8b7cff"/>
      <stop offset="0.5" stop-color="#4bd4e6"/>
      <stop offset="1" stop-color="#43e6a0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071020" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#background)"/>
  <g fill="none" stroke="url(#flow)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M112 132h76c36 0 52 22 52 54v70"/>
    <path d="M112 256h128"/>
    <path d="M112 380h76c36 0 52-22 52-54v-70"/>
    <path d="M324 256h76"/>
  </g>
  <g fill="#f4fbff" stroke="#152451" stroke-width="12">
    <circle cx="112" cy="132" r="30"/>
    <circle cx="112" cy="256" r="30"/>
    <circle cx="112" cy="380" r="30"/>
  </g>
  <path d="M256 174 338 256 256 338 174 256Z" fill="url(#flow)" stroke="#dffcff" stroke-width="12" filter="url(#shadow)"/>
  <path d="m220 257 25 25 52-58" fill="none" stroke="#102047" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="382" y="226" width="60" height="60" rx="17" fill="#f4fbff" stroke="#43e6a0" stroke-width="12"/>
</svg>
