[package]
name = "flowfoundry-desktop"
version = "0.1.0"
description = "FlowFoundry desktop control center"
authors = ["FlowFoundry contributors"]
license = "MIT"
edition = "2021"

[lib]
name = "flowfoundry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
