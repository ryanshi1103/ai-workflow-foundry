name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog
        run: PYTHONPATH=src python3 -m flowfoundry validate
      - name: Run foundation tests
        run: PYTHONPATH=src python3 -m unittest discover -s tests -v

  workspace-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/workspace-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: ./tests/test-cc.sh
      - run: ./tests/test-cc-eof-fix.sh
      - run: ./tests/test-deploy-profile-preservation.sh
      - run: PYTHONPATH=src python3 -m unittest discover -s tests -p 'test_*.py' -v

  integrated-components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Test media skills and document workflow
        run: |
          python3 -m unittest discover -s components/confera-media-skills/tests -v
          python3 -m unittest discover -s workflows/print-ready-nameplate-generator/tests -v
      - name: Install feedback application
        run: python3 -m pip install -e "applications/feedback-analysis-system[dev]"
      - name: Lint feedback application
        run: |
          ruff check applications/feedback-analysis-system/src \
            applications/feedback-analysis-system/tests \
            applications/feedback-analysis-system/app.py \
            applications/feedback-analysis-system/pages
      - name: Test feedback application
        run: pytest applications/feedback-analysis-system/tests -q
