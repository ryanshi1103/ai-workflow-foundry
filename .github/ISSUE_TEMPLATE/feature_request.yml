name: Feature request
description: Propose a scoped coordination, provider, workflow, or developer-experience improvement.
title: "[Proposal]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        FlowFoundry favors bounded, testable capabilities over broad autonomy.
        Large provider, permission, persistence, or architecture changes should
        begin as a design proposal.

  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: What outcome is difficult today, and for whom?
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Describe user value without assuming a particular implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orchestration and planning
        - Provider adapter
        - Workspace and permissions
        - Review, approval, or recovery
        - Workflow or component contract
        - Personal context (roadmap)
        - Documentation or developer experience
        - Reference application
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include non-goals and the smallest useful first increment.
    validations:
      required: true

  - type: textarea
    id: trust
    attributes:
      label: Trust and resource boundaries
      description: Explain permissions, network, secrets, personal data, cost, tools, and human approval impact.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Acceptance evidence
      description: What offline tests, failure behavior, documentation, and maturity label should be required?
    validations:
      required: true

  - type: checkboxes
    id: claims
    attributes:
      label: Scope confirmation
      options:
        - label: This proposal does not depend on AGI, autonomous human replacement, or an unbounded agent loop.
          required: true
        - label: I checked the current status and roadmap for an existing decision or duplicate proposal.
          required: true

