[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowfoundry-ai"
version = "0.2.0"
description = "Local human-AI coordination with minimum-sufficient execution and evidence"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Ryan Shi"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.scripts]
flowfoundry = "flowfoundry.cli:main"
aiproj = "flowfoundry.aiproj:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"flowfoundry.workspace.providers" = ["*.toml"]
"flowfoundry.control_center" = ["static/*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests", "core/workspace-manager/tests"]
pythonpath = ["src"]
