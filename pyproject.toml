[project]
name = "feedback-intelligence-system"
version = "0.3.0"
description = "Local-first feedback intelligence with AI analysis and human review"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.28.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "httpx>=0.25.0",
    "apify-client>=1.0.0",
    "apscheduler>=3.10.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["UP042"]  # StrEnum vs (str, Enum) is stylistic preference

[tool.ruff.lint.isort]
known-first-party = ["feedback_intelligence", "src"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
